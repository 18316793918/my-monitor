
name: 软考成绩监控

on:
  schedule:
    - cron: '3-59/5 * * * *'
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ruankao-score-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖及浏览器
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: 检查批次并推送
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          SEND_STATUS: ${{ github.event.schedule == '1 * * * *' && 'true' || 'false' }}
        run: python monitor.py

      - name: 检查失败时上传调试截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-${{ github.run_number }}
          path: debug.png
          if-no-files-found: ignore
          retention-days: 2
